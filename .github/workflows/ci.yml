name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  clippy:
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      - name: Run Clippy
        run: cargo clippy -- -D warnings

  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      - name: Install dependencies
        run: cargo build --release

      - name: Run tests
        run: cargo test --features ssr
